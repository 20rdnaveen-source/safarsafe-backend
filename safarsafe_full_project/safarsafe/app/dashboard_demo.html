<DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafarSafe — Responder Dashboard</title>
<style>
  :root {
    --bg: #f4f6f9;
    --card: #ffffff;
    --border: #e2e6ec;
    --text: #1a2233;
    --muted: #6b7688;
    --primary: #1e5fff;
    --danger: #e5322d;
    --warn: #f5a623;
    --ok: #2ecc71;
    --unassigned: #e5322d;
    --assigned: #f5a623;
    --resolved: #2ecc71;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header h1 {
    font-size: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 20px;
    background: #f0f2f5;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--ok); }
  .dot.offline { background: var(--danger); }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    padding: 16px 20px 0;
  }
  .summary-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .summary-card .num { font-size: 24px; font-weight: 700; }
  .summary-card .label { font-size: 11px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.03em; }
  .summary-card.total .num { color: var(--text); }
  .summary-card.unassigned .num { color: var(--unassigned); }
  .summary-card.assigned .num { color: var(--assigned); }
  .summary-card.resolved .num { color: var(--resolved); }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 8px;
    flex-wrap: wrap;
    gap: 10px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
  }
  .filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .refresh-note { font-size: 12px; color: var(--muted); }

  main { padding: 8px 20px 40px; max-width: 1200px; margin: 0 auto; }

  .empty-state {
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
    margin-top: 10px;
  }

  .incident-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 14px;
    margin-top: 10px;
  }
  .incident-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 5px solid var(--unassigned);
    border-radius: 12px;
    padding: 16px;
    animation: slideIn 0.3s ease;
  }
  .incident-card.status-Assigned { border-left-color: var(--assigned); }
  .incident-card.status-Resolved { border-left-color: var(--resolved); opacity: 0.7; }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .incident-card.flash { animation: flash 1.4s ease; }
  @keyframes flash {
    0% { background: #ffe3e1; }
    100% { background: var(--card); }
  }

  .incident-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .incident-type {
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 6px;
    color: #fff;
    text-transform: uppercase;
  }
  .badge.status-Unassigned { background: var(--unassigned); }
  .badge.status-Assigned { background: var(--assigned); }
  .badge.status-Resolved { background: var(--resolved); }
  .badge.sev-High { background: var(--danger); }
  .badge.sev-Medium { background: var(--warn); }
  .badge.sev-Low { background: var(--muted); }

  .incident-meta {
    font-size: 12px;
    color: var(--muted);
    margin: 3px 0;
  }
  .incident-meta b { color: var(--text); }

  .incident-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .action-btn {
    flex: 1;
    min-width: 90px;
    border: none;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .action-btn.assign { background: #fff4dd; color: #a26a00; }
  .action-btn.resolve { background: #e2f9ea; color: #16794a; }
  .action-btn.map { background: #eaf0ff; color: var(--primary); text-decoration: none; display: flex; align-items: center; justify-content: center; }
  .action-btn:disabled { opacity: 0.4; cursor: default; }

  .actions-log {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 11px;
    color: var(--muted);
    max-height: 60px;
    overflow-y: auto;
  }
</style>
</head>
<body>

<header>
  <h1>🛡️ SafarSafe — Responder Dashboard</h1>
  <div class="status-pill" id="statusPill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Connecting…</span>
  </div>
</header>

<div class="summary-bar">
  <div class="summary-card total">
    <div class="num" id="countTotal">0</div>
    <div class="label">Total</div>
  </div>
  <div class="summary-card unassigned">
    <div class="num" id="countUnassigned">0</div>
    <div class="label">Unassigned</div>
  </div>
  <div class="summary-card assigned">
    <div class="num" id="countAssigned">0</div>
    <div class="label">Assigned</div>
  </div>
  <div class="summary-card resolved">
    <div class="num" id="countResolved">0</div>
    <div class="label">Resolved</div>
  </div>
</div>

<div class="toolbar">
  <div class="filters">
    <button class="filter-btn active" data-filter="All">All</button>
    <button class="filter-btn" data-filter="Unassigned">Unassigned</button>
    <button class="filter-btn" data-filter="Assigned">Assigned</button>
    <button class="filter-btn" data-filter="Resolved">Resolved</button>
  </div>
  <div class="refresh-note">Auto-refreshing every 5s <span id="lastUpdated"></span></div>
</div>

<main>
  <div id="incidentContainer"></div>
</main>

<script>
const API_BASE = 'https://safarsafe-backend.onrender.com';
let currentFilter = 'All';
let knownIds = new Set();
let firstLoad = true;

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    render(lastIncidents);
  });
});

let lastIncidents = [];

async function checkServer() {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  try {
    const res = await fetch(API_BASE + '/', { cache: 'no-store' });
    if (res.ok) {
      dot.className = 'dot live';
      text.textContent = 'Live';
      return true;
    }
    throw new Error('bad status');
  } catch (e) {
    dot.className = 'dot offline';
    text.textContent = 'Offline';
    return false;
  }
}

async function fetchIncidents() {
  const ok = await checkServer();
  if (!ok) return;
  try {
    const res = await fetch(API_BASE + '/api/incidents');
    const data = await res.json();
    const incidents = (data.incidents || []).slice().sort((a, b) =>
      new Date(b.created_at) - new Date(a.created_at)
    );
    lastIncidents = incidents;
    await refreshLiveLocations(incidents);
    render(incidents);
    document.getElementById('lastUpdated').textContent =
      '· updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    console.error('Failed to fetch incidents', e);
  }
}

function render(incidents) {
  const container = document.getElementById('incidentContainer');
  const total = incidents.length;
  const unassigned = incidents.filter(i => i.status === 'Unassigned').length;
  const assigned = incidents.filter(i => i.status === 'Assigned').length;
  const resolved = incidents.filter(i => i.status === 'Resolved').length;

  document.getElementById('countTotal').textContent = total;
  document.getElementById('countUnassigned').textContent = unassigned;
  document.getElementById('countAssigned').textContent = assigned;
  document.getElementById('countResolved').textContent = resolved;

  const filtered = currentFilter === 'All'
    ? incidents
    : incidents.filter(i => i.status === currentFilter);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">No ${currentFilter !== 'All' ? currentFilter.toLowerCase() : ''} incidents right now.<br>New SOS alerts will appear here automatically.</div>`;
    return;
  }

  container.innerHTML = `<div class="incident-grid">${filtered.map(cardHtml).join('')}</div>`;

  if (!firstLoad) {
    incidents.forEach(inc => {
      if (!knownIds.has(inc.incident_id)) {
        const el = document.querySelector(`[data-id="${inc.incident_id}"]`);
        if (el) el.classList.add('flash');
      }
    });
  }
  incidents.forEach(inc => knownIds.add(inc.incident_id));
  firstLoad = false;
}

// Cache of latest live location per user_id, refreshed separately from the incident list.
const liveLocations = {};

async function refreshLiveLocations(incidents) {
  const activeUserIds = [...new Set(
    incidents.filter(i => i.status !== 'Resolved').map(i => i.user_id)
  )];
  await Promise.all(activeUserIds.map(async (uid) => {
    try {
      const res = await fetch(API_BASE + '/api/location/' + uid);
      const data = await res.json();
      if (data.latitude !== null && data.latitude !== undefined) {
        liveLocations[uid] = data;
      }
    } catch (e) { /* keep last known value on failure */ }
  }));
}

function cardHtml(inc) {
  const live = liveLocations[inc.user_id];
  const isTracking = inc.status !== 'Resolved' && live && live.latitude !== null;
  const lat = isTracking ? live.latitude : inc.latitude;
  const lng = isTracking ? live.longitude : inc.longitude;
  const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;
  const time = new Date(inc.created_at).toLocaleTimeString();
  const liveTime = isTracking && live.timestamp ? new Date(live.timestamp).toLocaleTimeString() : null;
  const actionsLog = (inc.actions || []).map(a =>
    `${a.responder || 'Responder'}: ${a.action || a.status || ''} (${new Date(a.timestamp).toLocaleTimeString()})`
  ).join('<br>');

  const hasReporter = inc.reporter_name || inc.reporter_phone;
  const reporterBlock = hasReporter ? `
    <div class="incident-meta" style="display:flex; align-items:center; gap:8px; margin-top:6px; padding:6px; background:#f0f7ff; border-radius:8px;">
      ${inc.reporter_photo
        ? `<img src="${inc.reporter_photo}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">`
        : `<div style="width:36px;height:36px;border-radius:50%;background:#dbe6ff;display:flex;align-items:center;justify-content:center;font-size:16px;">👤</div>`}
      <div>
        <div style="font-weight:700;">${inc.reporter_name || 'Unknown name'}</div>
        <div style="color:var(--muted);">${inc.reporter_phone || 'No phone on file'}</div>
        ${inc.reporter_blood_group ? `<div style="color:#c0392b;font-weight:700;">Blood group: ${inc.reporter_blood_group}</div>` : ''}
      </div>
    </div>
  ` : `<div class="incident-meta" style="color:var(--muted);">Reporter not logged in — no name/phone on file</div>`;

  return `
    <div class="incident-card status-${inc.status}" data-id="${inc.incident_id}">
      <div class="incident-top">
        <div class="incident-type">🚨 ${inc.incident_type || 'SOS'}</div>
        <div style="display:flex; gap:6px;">
          <span class="badge sev-${inc.severity}">${inc.severity}</span>
          <span class="badge status-${inc.status}">${inc.status}</span>
        </div>
      </div>
      <div class="incident-meta">ID: <b>${inc.incident_id}</b> · Tourist: <b>${inc.user_id}</b></div>
      ${reporterBlock}
      <div class="incident-meta">📍 ${Number(lat).toFixed(5)}, ${Number(lng).toFixed(5)} ${isTracking ? '<span style="color:var(--danger); font-weight:700;">● LIVE</span>' : ''}</div>
      <div class="incident-meta">🕒 Reported at ${time}${liveTime ? ` · last position update ${liveTime}` : ''}</div>
      <div class="incident-actions">
        <button class="action-btn assign" onclick="updateStatus('${inc.incident_id}','Assigned')" ${inc.status !== 'Unassigned' ? 'disabled' : ''}>Assign</button>
        <button class="action-btn resolve" onclick="updateStatus('${inc.incident_id}','Resolved')" ${inc.status === 'Resolved' ? 'disabled' : ''}>Resolve</button>
        <a class="action-btn map" href="${mapUrl}" target="_blank">Map ↗</a>
      </div>
      ${actionsLog ? `<div class="actions-log">${actionsLog}</div>` : ''}
    </div>
  `;
}

async function updateStatus(id, status) {
  try {
    await fetch(API_BASE + '/api/incidents/' + id, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        status: status,
        responder: 'Dashboard Operator',
        action: status === 'Assigned' ? 'Responder dispatched' : 'Incident resolved'
      })
    });
    fetchIncidents();
  } catch (e) {
    alert('Could not update incident. Check that the backend server is running.');
  }
}

fetchIncidents();
setInterval(fetchIncidents, 5000);
</script>

</body>
</html>
